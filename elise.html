<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleos Stars | Elise Witek</title>
    <style>
        :root {
            --gold: #FFC14C;
            --indigo: #294355;
            --light-blue: #D7EDFC;
            --white: #ffffff;
            --serif: "Georgia", "Times New Roman", Times, serif;
            --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #F4F7F9;
            color: var(--indigo);
            font-family: var(--sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .nav {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            text-decoration: none;
            color: var(--indigo);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo { height: 30px; }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-top: 40px;
        }

        .badge {
            background: #E0F2FE;
            color: var(--indigo);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .name-title h1 {
            font-family: var(--serif);
            font-size: 4.5rem;
            margin: 0;
            line-height: 1.1;
        }

        .name-title h2 {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 1.8rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        .profile-frame {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #eee;
            box-shadow: 0 30px 60px rgba(41, 67, 85, 0.1);
            border: 12px solid white;
        }

        .message-box {
            grid-column: 1 / -1;
            background: var(--light-blue);
            padding: 80px 100px;
            border-radius: 60px;
            margin-top: 80px;
